<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />

    <!-- Lets residents install the site as an app ("Add to Home screen"). -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Townsquare" />

    <!--
      The title and description are what a search result actually shows, and
      they are the only part of this page a crawler reads without running any
      JavaScript. "Rockaway, New Jersey" is in both on purpose: the bare name
      is not unique, and nobody looking for this association omits the town.
    -->
    <title>Townsquare Village HOA — Rockaway, New Jersey</title>
    <meta name="description" content="Official site of Townsquare Village HOA, Inc. in Rockaway, New Jersey. Contact the association office, and submit and track maintenance requests online." />
    <link rel="canonical" href="https://townsquarevillagenj.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Townsquare Village HOA" />
    <meta property="og:title" content="Townsquare Village HOA — Rockaway, New Jersey" />
    <meta property="og:description" content="Contact the association office, and submit and track maintenance requests online." />
    <meta property="og:url" content="https://townsquarevillagenj.com/" />
    <meta name="twitter:card" content="summary" />

    <!--
      Tells Google that this name, this address and this phone number are the
      same organisation, rather than leaving it to infer that from prose it
      has to render JavaScript to see. It is the one piece of markup that
      connects the site to a place, which is how a local search is answered.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Townsquare Village HOA, Inc.",
      "alternateName": "Townsquare Village",
      "url": "https://townsquarevillagenj.com/",
      "email": "office@townsquarevillagenj.com",
      "telephone": "+1-973-328-4015",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "129 Pondview Terrace",
        "addressLocality": "Rockaway",
        "addressRegion": "NJ",
        "postalCode": "07866",
        "addressCountry": "US"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need JavaScript enabled to use this application.</noscript>
    <div id="root"></div>
  </body>
</html>
